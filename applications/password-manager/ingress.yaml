apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: password-manager-service
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /password-manager
            pathType: Prefix
            backend:
              service:
                name: password-manager-service
                port:
                  number: 6966