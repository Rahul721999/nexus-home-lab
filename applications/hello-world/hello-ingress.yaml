apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-service
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: hello-service
                port:
                  number: 8080