
# Project: nexus-home-lab
# Helm chart: traefik/traefik
# Chart version: 42.2.0
# Traefik version: 3.7.16

deployment:
  enabled: true
  replicas: 1

service:
  enabled: true
  spec:
    type: ClusterIP

providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik

  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    allowExternalNameServices: false

ingressClass:
  enabled: true
  name: traefik
  isDefaultClass: false

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80

  websecure:
    port: 8443
    expose:
      default: false
    exposedPort: 443

api:
  dashboard: false
  insecure: false

ingressRoute:
  dashboard:
    enabled: false

log:
  level: INFO

accessLog:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
